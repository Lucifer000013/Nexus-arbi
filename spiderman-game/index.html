<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<title>Web Swing — Человек-паук</title>
<style>
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, U, TU; // U = unit scale
function resize(){
  const d = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*d; cv.height = H*d;
  ctx.setTransform(d,0,0,d,0,0);
  U = Math.min(H, 900)/800; TU = Math.min(U, W/420);
}
addEventListener('resize', resize); resize();

const rnd = (a,b)=>a+Math.random()*(b-a);
let state = 'menu', best = +(localStorage.getItem('spBest')||0);
let p, cam, anchor, rope, coins, drones, bldgs, stars, score, coinsGot, lives, hold, t, invul, shake, popups;

function reset(){
  p = {x:0,y:H*0.35,vx:260*U,vy:0};
  cam = 0; anchor = null; rope = 0; score = 0; coinsGot = 0; lives = 3;
  hold = false; t = 0; invul = 0; shake = 0; popups = [];
  coins = []; drones = []; bldgs = []; stars = [];
  for(let i=0;i<70;i++) stars.push({x:Math.random(),y:Math.random()*0.7,r:rnd(0.5,1.6)});
  genTo = -W; genUntil(W*2);
}
let genTo = 0, bx = 0;
function genUntil(x){
  while(bx < x){
    const w = rnd(70,140)*U, h = rnd(0.12,0.4)*H;
    bldgs.push({x:bx,w,h,hue:rnd(220,260),win:Math.random()});
    bx += w + rnd(0,12);
  }
  while(genTo < x){
    genTo += rnd(220,380)*U;
    const y = rnd(0.12,0.62)*H;
    if(Math.random()<0.35){
      drones.push({x:genTo,y,ph:Math.random()*6,r:20*U,vy:rnd(30,80)*U});
    } else {
      const n = 3+(Math.random()*4|0), arc = Math.random()<0.5;
      for(let i=0;i<n;i++) coins.push({x:genTo+i*46*U,y:y+(arc?Math.sin(i/(n-1)*Math.PI)*-50*U:0),got:false});
    }
  }
}
reset();

function press(e){
  if(e) e.preventDefault();
  if(state!=='play'){ if(state==='menu'||state==='over'){ reset(); state='play'; } return; }
  hold = true; shoot();
}
function release(e){ if(e) e.preventDefault(); hold=false; anchor=null; }
function shoot(){
  // web attaches to a point ahead and above the hero
  const dx = (140+Math.max(0,p.vx)*0.25)*U;
  const ay = Math.max(-H*0.15, p.y - Math.max(200*U, H*0.28));
  anchor = {x:p.x+dx, y:ay};
  rope = Math.hypot(anchor.x-p.x, anchor.y-p.y);
}
cv.addEventListener('touchstart',press,{passive:false});
cv.addEventListener('touchend',release,{passive:false});
cv.addEventListener('touchcancel',release,{passive:false});
cv.addEventListener('mousedown',press);
addEventListener('mouseup',release);
addEventListener('keydown',e=>{ if(e.code==='Space'&&!e.repeat) press(e); });
addEventListener('keyup',e=>{ if(e.code==='Space') release(e); });

function hurt(){
  if(invul>0) return;
  lives--; invul = 1.6; shake = 0.4; anchor = null;
  p.vy = -300*U;
  if(lives<=0) end();
}
function end(){
  state='over';
  if(score>best){ best=score|0; try{localStorage.setItem('spBest',best)}catch(_){} }
}

function update(dt){
  t += dt; invul = Math.max(0,invul-dt); shake = Math.max(0,shake-dt);
  const g = 1300*U;
  p.vy += g*dt;
  if(anchor){
    // pump: a little tangential boost while swinging so momentum builds
    const rx=p.x-anchor.x, ry=p.y-anchor.y, d=Math.hypot(rx,ry)||1;
    const tx=-ry/d, ty=rx/d, s = Math.sign(p.vx*tx+p.vy*ty)||1;
    p.vx += tx*s*260*U*dt; p.vy += ty*s*260*U*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    const nx=p.x-anchor.x, ny=p.y-anchor.y, nd=Math.hypot(nx,ny);
    if(nd>rope){
      const ux=nx/nd, uy=ny/nd;
      p.x = anchor.x+ux*rope; p.y = anchor.y+uy*rope;
      const vr = p.vx*ux+p.vy*uy;
      if(vr>0){ p.vx-=ux*vr; p.vy-=uy*vr; }
    }
    // keep the anchor from falling behind: re-shoot when hero passes under it
    if(p.x > anchor.x + 30*U && hold){ shoot(); }
  } else {
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx += (300*U - p.vx)*0.15*dt; // drift back to cruising speed
  }
  const sp = Math.hypot(p.vx,p.vy), max = 900*U;
  if(sp>max){ p.vx*=max/sp; p.vy*=max/sp; }
  if(p.vx<120*U) p.vx = 120*U;
  if(p.y<-H*0.2 && p.vy<0) p.vy=0;

  cam += ((p.x - W*0.3) - cam)*Math.min(1,dt*6);
  score = Math.max(score, p.x/(40*U));
  genUntil(cam+W*2);

  // street
  const street = H*0.94;
  if(p.y > street){ lives=0; end(); }
  // rooftops bounce-hurt
  for(const b of bldgs){
    if(p.x>b.x && p.x<b.x+b.w && p.y > H-b.h-12*U && p.y < street){
      // slide off rooftop gently
      p.y = H-b.h-12*U; p.vy = Math.min(p.vy,-200*U); hurt();
    }
  }
  for(const c of coins){
    if(!c.got && Math.hypot(c.x-p.x,c.y-p.y)<28*U){ c.got=true; coinsGot++; score+=5;
      popups.push({x:c.x,y:c.y,t:0,s:'+5'}); }
  }
  for(const d of drones){
    const dy = d.y+Math.sin(t*2+d.ph)*d.vy*0.6;
    d.cy = dy;
    if(Math.hypot(d.x-p.x,dy-p.y)<d.r+14*U) hurt();
  }
  coins = coins.filter(c=>c.x>cam-100);
  drones = drones.filter(d=>d.x>cam-100);
  bldgs = bldgs.filter(b=>b.x+b.w>cam-W);
  popups.forEach(o=>o.t+=dt); popups = popups.filter(o=>o.t<0.8);
}

function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b1030'); g.addColorStop(0.6,'#3a1c5c'); g.addColorStop(1,'#e2506b');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(const s of stars){ ctx.globalAlpha=0.6; ctx.beginPath(); ctx.arc(((s.x*W - cam*0.02)%W+W)%W, s.y*H, s.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,240,200,.9)'; ctx.beginPath(); ctx.arc(W*0.8,H*0.16,26*U,0,7); ctx.fill();
}
function drawCity(){
  // far layer
  ctx.fillStyle='#22194a';
  for(let i=-1;i<W/60+2;i++){
    const x = i*60 - (cam*0.3)%60, h = 60+((Math.sin(Math.floor((cam*0.3)/60)+i*12.9898)*43758.5453)%1+1)%1*160;
    ctx.fillRect(x, H*0.94-h*U, 54, h*U+H);
  }
  // near buildings
  for(const b of bldgs){
    const x=b.x-cam, y=H-b.h;
    ctx.fillStyle=`hsl(${b.hue},35%,14%)`; ctx.fillRect(x,y,b.w,b.h);
    ctx.fillStyle='rgba(255,220,120,.7)';
    for(let wy=y+10*U; wy<H-20*U; wy+=18*U) for(let wx=x+8*U; wx<x+b.w-10*U; wx+=16*U){
      if(((wx*7+wy*13+b.win*100)|0)%3===0) ctx.fillRect(wx,wy,6*U,8*U);
    }
  }
  ctx.fillStyle='#0a0a14'; ctx.fillRect(0,H*0.94,W,H*0.06);
}
function drawSpidey(){
  const x=p.x-cam, y=p.y, s=U;
  if(invul>0 && Math.floor(invul*12)%2) return;
  const ang = anchor ? Math.atan2(anchor.y-p.y, anchor.x-p.x)+Math.PI/2 : Math.atan2(p.vy,p.vx)*0.5;
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.lineWidth=5*s; ctx.lineCap='round';
  // limbs
  ctx.strokeStyle='#1c4fd6';
  const flail = anchor?0:Math.sin(t*14)*0.4;
  ctx.beginPath();
  ctx.moveTo(-3*s,-2*s); ctx.lineTo(-14*s,-16*s-flail*8*s);
  ctx.moveTo(3*s,-2*s);  ctx.lineTo(14*s,-16*s+flail*8*s);
  ctx.stroke();
  ctx.strokeStyle='#d61f2c';
  ctx.beginPath();
  ctx.moveTo(-3*s,8*s); ctx.lineTo(-10*s,22*s+flail*6*s);
  ctx.moveTo(3*s,8*s);  ctx.lineTo(10*s,22*s-flail*6*s);
  ctx.stroke();
  // torso
  ctx.fillStyle='#d61f2c'; ctx.beginPath(); ctx.ellipse(0,3*s,9*s,13*s,0,0,7); ctx.fill();
  ctx.fillStyle='#1c4fd6'; ctx.beginPath(); ctx.ellipse(0,9*s,9*s,7*s,0,0,Math.PI); ctx.fill();
  // spider emblem
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.ellipse(0,1*s,2.4*s,4*s,0,0,7); ctx.fill();
  // head
  ctx.fillStyle='#d61f2c'; ctx.beginPath(); ctx.arc(0,-15*s,9*s,0,7); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=1*s;
  ctx.beginPath(); ctx.moveTo(0,-24*s); ctx.lineTo(0,-6*s); ctx.moveTo(-8*s,-15*s); ctx.lineTo(8*s,-15*s); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.strokeStyle='#111';
  for(const m of [-1,1]){
    ctx.beginPath(); ctx.moveTo(m*2*s,-14*s); ctx.quadraticCurveTo(m*8*s,-19*s,m*8.5*s,-12*s); ctx.quadraticCurveTo(m*5*s,-10*s,m*2*s,-14*s);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake>0) ctx.translate(rnd(-6,6)*shake*U, rnd(-6,6)*shake*U);
  drawSky(); drawCity();
  // coins
  for(const c of coins){ if(c.got) continue;
    const x=c.x-cam; if(x<-20||x>W+20) continue;
    ctx.fillStyle='#ffd23f'; ctx.strokeStyle='#b8860b'; ctx.lineWidth=2*U;
    ctx.beginPath(); ctx.ellipse(x,c.y,9*U*Math.abs(Math.cos(t*4+c.x)),9*U,0,0,7); ctx.fill(); ctx.stroke(); }
  // drones
  for(const d of drones){
    const x=d.x-cam, y=d.cy??d.y; if(x<-40||x>W+40) continue;
    ctx.fillStyle='#2b2b3a'; ctx.beginPath(); ctx.arc(x,y,d.r,0,7); ctx.fill();
    ctx.strokeStyle='#666'; ctx.lineWidth=3*U; ctx.beginPath(); ctx.moveTo(x-d.r*1.4,y-d.r); ctx.lineTo(x+d.r*1.4,y-d.r); ctx.stroke();
    ctx.fillStyle=Math.sin(t*8)>0?'#ff2d2d':'#700'; ctx.beginPath(); ctx.arc(x,y,d.r*0.35,0,7); ctx.fill();
  }
  // web
  if(anchor){
    ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=2*U;
    ctx.beginPath(); ctx.moveTo(p.x-cam,p.y-10*U); ctx.lineTo(anchor.x-cam,anchor.y); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(anchor.x-cam,anchor.y,3*U,0,7); ctx.fill();
  }
  drawSpidey();
  ctx.font=`bold ${16*U}px system-ui`; ctx.textAlign='center'; ctx.fillStyle='#ffd23f';
  for(const o of popups){ ctx.globalAlpha=1-o.t/0.8; ctx.fillText(o.s,o.x-cam,o.y-o.t*40*U); } ctx.globalAlpha=1;
  ctx.restore();
  hud();
}
function hud(){
  ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.font=`bold ${22*TU}px system-ui`;
  const top = 34*U;
  if(state==='play'){
    ctx.fillText(`${score|0} м`,16,top);
    ctx.fillStyle='#ffd23f'; ctx.fillText(`● ${coinsGot}`,16,top+26*U);
    ctx.textAlign='right'; ctx.fillStyle='#ff4d5e';
    ctx.fillText('♥'.repeat(Math.max(0,lives)),W-16,top);
  }
  if(state!=='play'){
    ctx.fillStyle='rgba(5,5,20,.6)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#fff';
    ctx.font=`900 ${44*TU}px system-ui`;
    ctx.fillText(state==='menu'?'WEB SWING':'Игра окончена',W/2,H*0.32);
    ctx.font=`${20*TU}px system-ui`;
    if(state==='over'){
      ctx.fillText(`Дистанция: ${score|0} м   Монеты: ${coinsGot}`,W/2,H*0.32+40*U);
    } else {
      ctx.fillText('Человек-паук раскачивается на паутине',W/2,H*0.32+40*U);
    }
    ctx.fillText(`Рекорд: ${best} м`,W/2,H*0.32+70*U);
    ctx.fillStyle='#ffd23f'; ctx.font=`bold ${24*TU}px system-ui`;
    ctx.fillText(state==='menu'?'Нажми, чтобы начать':'Нажми, чтобы играть снова',W/2,H*0.58);
    ctx.fillStyle='#ccd'; ctx.font=`${16*TU}px system-ui`;
    ctx.fillText('Удерживай экран — паутина, отпусти — прыжок',W/2,H*0.58+34*U);
    ctx.fillText('Собирай монеты, избегай дронов и не падай!',W/2,H*0.58+58*U);
  }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.033,(now-last)/1000); last = now;
  if(state==='play') update(dt); else t+=dt;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
